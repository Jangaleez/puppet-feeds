<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puppet Space</title>
<meta name="description" content="Puppet Space - a live audio room for the Bitcoin Puppets community.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Comic+Neue:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: header with topic toggles, the briefing in the main column, the merged news list beside it. */
:root{
  --bg:#fffdf6; --panel:#ffffff; --ink:#111111; --muted:#4a4a4a; --line:#111111;
  --accent:#f7931a; --accent-ink:#111111; --chip:#ffe14d; --sky:#7fd3ff; --bad:#d4130f; --good:#1f8a3b;
  --stroke:#111111; --shadow:#111111; --dots:#e9e2cf;
  --display:"Gochi Hand","Comic Sans MS","Comic Neue",cursive;
  --body:"Comic Neue","Comic Sans MS",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --wobble:255px 18px 225px 18px/18px 225px 18px 255px;
  --wobble2:18px 225px 18px 255px/255px 18px 225px 18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130f; --panel:#1f1c16; --ink:#fff8e6; --muted:#d6ccb4; --line:#fff8e6;
  --accent:#f7931a; --accent-ink:#111111; --chip:#ffd21f; --sky:#4fb8ec; --bad:#ff7a6e; --good:#6fdc8c;
  --stroke:#fff8e6; --shadow:#f7931a; --dots:#2a261d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15130f; --panel:#1f1c16; --ink:#fff8e6; --muted:#d6ccb4; --line:#fff8e6;
  --accent:#f7931a; --accent-ink:#111111; --chip:#ffd21f; --sky:#4fb8ec; --bad:#ff7a6e; --good:#6fdc8c;
  --stroke:#fff8e6; --shadow:#f7931a; --dots:#2a261d; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) radial-gradient(var(--dots) 1.5px,transparent 1.6px) 0 0/22px 22px;color:var(--ink);font:16px/1.5 var(--body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{background:var(--accent);border-bottom:4px solid var(--stroke);color:#111}
header .wrap{padding-block:18px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font:400 44px/1 var(--display);margin:0;transform:rotate(-1.5deg)}
.brand span{font-weight:700;font-size:14px}
.mascot{width:76px;height:76px;flex:none;display:block;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.mascot img,.mascot svg{width:100%;height:100%;object-fit:cover;display:block}
@keyframes bob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-3px)}}
header .mascot{border:3px solid #111;border-radius:var(--wobble);box-shadow:4px 4px 0 #111;overflow:hidden;width:84px;height:84px}

.btn{border:3px solid var(--stroke);background:var(--chip);color:#111;border-radius:var(--wobble2);box-shadow:3px 3px 0 var(--shadow);font:400 19px var(--display);padding:6px 16px;transition:transform .08s}
.btn:hover{transform:translate(-1px,-1px) rotate(-1deg)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn:disabled{opacity:.6;cursor:default;transform:none}
.btn.primary{background:var(--accent);color:#111}
header .btn.primary{background:#fff;color:#111;border-color:#111;box-shadow:3px 3px 0 #111}
.tag{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:2px solid var(--stroke);background:var(--sky);color:#111;white-space:nowrap}
.tag.v{background:var(--accent);color:#111}
.empty{color:var(--muted);font-size:14px}
.section-h{font:400 26px/1 var(--display);color:var(--ink);transform:rotate(-1deg);margin:0 0 12px}

/* topic toggles */
.topicbar{display:flex;flex-direction:column;gap:8px}
.topicbar .hint{font-weight:700;font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.topics{display:flex;gap:8px;flex-wrap:wrap}
.topic{border:2px solid #111;background:#fff;color:#111;font-weight:700;font-size:14px;border-radius:var(--wobble);box-shadow:2px 2px 0 #111;padding:6px 12px;display:inline-flex;gap:6px;align-items:center}
.topic[aria-pressed="true"]{background:#111;color:#fff;box-shadow:2px 2px 0 #fff}
.topic[aria-pressed="true"]::after{content:"✓";font-size:12px}
.topic:disabled{opacity:.45;cursor:not-allowed}
.topic:not(:disabled):active{transform:translate(2px,2px);box-shadow:none}

main .wrap{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px;padding-block:24px 40px;align-items:start}
@media (max-width:900px){main .wrap{grid-template-columns:1fr}}

.panel{background:var(--panel);border:3px solid var(--stroke);border-radius:var(--wobble);box-shadow:6px 6px 0 var(--shadow);padding:20px}
.status{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border:3px dashed var(--stroke);border-radius:var(--wobble);font-weight:700}
.status .mascot{width:54px;height:54px;border:2px solid var(--stroke);border-radius:var(--wobble2);overflow:hidden}
.status.err{color:var(--bad)}

/* briefing */
.brief-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:12px var(--mono);color:var(--muted);margin-bottom:10px}
.brief h2{font:400 40px/1.05 var(--display);margin:0 0 12px;text-wrap:balance}
.overview{font-size:18px;margin:0 0 16px}
.prices{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.price{font:500 13px var(--mono);border:2px solid var(--stroke);border-radius:var(--wobble2);padding:3px 10px;background:var(--bg)}
.up{color:var(--good)} .down{color:var(--bad)}
.moods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:22px}
.mood{border:2px solid var(--stroke);border-radius:var(--wobble2);padding:8px 10px;background:var(--bg);font-size:14px}
.mood b{display:flex;justify-content:space-between;gap:6px;margin-bottom:2px}
.tone{font:500 11px var(--mono);text-transform:uppercase;padding:1px 6px;border-radius:4px;border:2px solid var(--stroke)}
.tone.positive{background:#b7f5c8;color:#111} .tone.negative{background:#ffb4ab;color:#111}
.tone.mixed{background:var(--chip);color:#111} .tone.quiet{background:var(--panel)}
.brief h3{font:400 28px/1 var(--display);margin:24px 0 12px;transform:rotate(-1deg)}
.thread,.scenario{border-top:2px dashed var(--stroke);padding:12px 0}
.thread h4,.scenario h4{margin:0 0 4px;font-size:17px;line-height:1.3}
.thread p,.scenario p{margin:0 0 6px}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:6px}
.ref{font:500 11px var(--mono);text-decoration:none;border:1.5px solid var(--stroke);border-radius:4px;padding:0 4px;background:var(--bg)}
.ref:hover{background:var(--chip);color:#111}
.lik{font:500 11px var(--mono);text-transform:uppercase;padding:1px 6px;border:2px solid var(--stroke);border-radius:4px}
.lik.high{background:var(--accent);color:#111} .lik.medium{background:var(--chip);color:#111} .lik.low{background:var(--panel)}
.scenario .when{font:12px var(--mono);color:var(--muted)}
.signals{margin:4px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.upcoming{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.upcoming li{display:flex;gap:10px}
.upcoming b{font:500 12px var(--mono);min-width:92px;padding-top:3px}
.disclaimer{margin:22px 0 0;font-size:13px;color:var(--muted);border-top:3px dashed var(--stroke);padding-top:10px}
.skeleton{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--dots),var(--panel),var(--dots));background-size:200% 100%;animation:shimmer 1.4s infinite;margin:10px 0}
@keyframes shimmer{to{background-position:-200% 0}}

/* news list */
.feedbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filt{border:2px solid var(--stroke);background:var(--panel);border-radius:var(--wobble2);padding:2px 10px;font:700 13px var(--body);box-shadow:2px 2px 0 var(--shadow)}
.filt[aria-pressed="true"]{background:var(--chip);color:#111}
.stories{display:flex;flex-direction:column}
.story{padding:11px 0;border-top:2px dashed var(--stroke)}
.story a.t{font-weight:700;text-decoration:none;line-height:1.35;display:block}
.story a.t:hover{text-decoration:underline wavy var(--accent)}
.story .info{font:12px var(--mono);color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.story.x a.t::before{content:"⇄ ";color:var(--accent)}
.story.hi{background:var(--chip);color:#111;margin:0 -8px;padding-inline:8px;border-radius:8px}
.story.hi .info{color:#111}
.more-btn{margin-top:12px}

footer{border-top:3px dashed var(--stroke)}
footer .wrap{padding-block:16px;font-size:13px;color:var(--muted)}
footer b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Puppet Space ===== */
/* ===== Listening party ===== */
.party-open{margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:#fff;color:#111;border-color:#111;box-shadow:3px 3px 0 #111}
.live-dot{width:10px;height:10px;border-radius:50%;background:#999;border:2px solid #111}
.party-open.on .live-dot{background:#e0201b;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.35)}}
#party .wrap{padding-block:18px 0}
.party-box{background:var(--panel);border:3px solid var(--stroke);border-radius:var(--wobble);box-shadow:6px 6px 0 var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.party-box h2{font:400 30px/1 var(--display);margin:0}
.party-box p{margin:0;color:var(--muted);max-width:65ch}
.party-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.party-row input{flex:1;min-width:160px;max-width:320px;padding:10px 14px;border:3px solid var(--stroke);border-radius:var(--wobble);background:var(--bg)}
.party-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.live{font:400 26px/1 var(--display);display:flex;align-items:center;gap:10px}
.live .live-dot{background:#e0201b;animation:pulse 1.2s ease-in-out infinite}
.people{display:flex;flex-wrap:wrap;gap:10px}
.person{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:2px solid var(--stroke);border-radius:var(--wobble);background:var(--bg);font-weight:700;font-size:14px;transition:box-shadow .15s}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#111;display:grid;place-items:center;border:2px solid var(--stroke);font-family:var(--display);font-size:16px;flex:none}
.person.speaking{box-shadow:0 0 0 4px var(--accent)}
.person small{font:500 11px var(--mono);color:var(--muted)}
.person .tag{margin-left:2px}
.mic-off{opacity:.55}
.sync{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:2px dashed var(--stroke);border-radius:var(--wobble2);font-weight:700}
.btn.danger{background:var(--bad);color:#fff}
.btn.on{background:var(--accent);color:#111}
.party-box .party-err{color:var(--bad);font-weight:700}
.sp-title{display:flex;flex-direction:column;gap:6px;min-width:0}
.sp-title h2{font:400 30px/1.05 var(--display);margin:0;text-wrap:balance;overflow-wrap:anywhere}
.count{font:12px var(--mono);color:var(--muted)}
.party-box .section-h{margin:4px 0 0}
.stage{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;align-items:start}
.manage{margin-top:4px}
.manage summary{cursor:pointer;font:700 12px var(--body);list-style:none;border:2px solid var(--stroke);border-radius:var(--wobble2);padding:2px 10px;background:var(--panel);box-shadow:2px 2px 0 var(--shadow)}
.manage summary::-webkit-details-marker{display:none}
.manage[open] summary{background:var(--chip);color:#111}
.manage .acts{flex-direction:column;align-items:stretch;margin-top:6px}
.person .manage .acts{flex-direction:row}
.speaker{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:14px 10px;border:2px solid var(--stroke);border-radius:var(--wobble);background:var(--bg);min-width:0}
.speaker b{font-size:15px;overflow-wrap:anywhere}
.speaker small{font:500 11px var(--mono);color:var(--muted)}
.av.big{width:64px;height:64px;font-size:30px;border-width:3px;transition:box-shadow .15s}
.speaker.speaking .av.big{box-shadow:0 0 0 5px var(--accent),0 0 0 8px var(--stroke)}
.acts{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.person .acts{margin:0 0 0 4px;justify-content:flex-start}
.mini{border:2px solid var(--stroke);background:var(--panel);border-radius:var(--wobble2);padding:2px 8px;font:700 12px var(--body);box-shadow:2px 2px 0 var(--shadow)}
.mini:hover{background:var(--chip);color:#111}
.mini.go{background:var(--accent);color:#111}
.person.hand{background:var(--chip);color:#111}
.person.hand small{color:#111}
.person{flex-wrap:wrap}
.host-login summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);width:max-content}
.host-login .party-row{margin-top:8px}
#party .wrap{padding-block:28px 40px}
#hidePartyBtn,#partyBtn{display:none}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand">
    <span class="mascot" id="mascot" aria-hidden="true"></span>
    <h1>Puppet Space</h1><span>A live audio room for the Bitcoin Puppets community.</span>
    <button class="btn party-open" type="button" id="partyBtn"><span class="live-dot"></span>Puppet Space</button>
  </div>
</div></header>

<section id="party"><div class="wrap"><div class="party-box" id="partyBox"></div></div></section>

<footer><div class="wrap">
  <b>Puppet Space</b> is a community derivative of Bitcoin Puppets, shared under the VPL (Viral Public License). Use it, change it, pass it on.
</div></footer>

/* ---------- Puppet Space: live audio room on LiveKit ----------
   Roles live on the server: the pass function decides who can speak, and the room enforces it. */
const SPACE_API = "/api/space";
const LIVEKIT_JS = "https://unpkg.com/livekit-client@2.23.0/dist/livekit-client.umd.js";
const ROLE_LABEL = {host:"Host", cohost:"Co-host", speaker:"Speaker", listener:"Listener"};
let room = null, LK = null;
const sp = {joined:false, joining:false, token:"", hands:{}, error:"", note:"", editing:false, busy:false};

function loadLiveKit(){
  if (window.LivekitClient) return Promise.resolve(window.LivekitClient);
  return new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = LIVEKIT_JS;
    s.onload = () => window.LivekitClient ? res(window.LivekitClient) : rej(new Error("Voice chat didn't load."));
    s.onerror = () => rej(new Error("Couldn't load voice chat. Check your connection, or turn off browser shields for this site."));
    document.head.appendChild(s);
  });
}

async function api(action, extra = {}){
  if (location.protocol === "file:") throw new Error("The Space only works on the hosted site, not from a downloaded file.");
  const res = await fetch(SPACE_API, {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({action, token: sp.token, ...extra})});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || (res.status === 404 ? "The Space isn't set up on this site yet." : "Something went wrong. Try again."));
  return data;
}

const everyone = () => room ? [room.localParticipant, ...room.remoteParticipants.values()] : [];
const roleOf = p => { try{ const r = JSON.parse(p?.metadata || "{}").role; return ROLE_LABEL[r] ? r : "listener"; }catch{ return "listener"; } };
const me = () => room?.localParticipant;
const myRole = () => roleOf(me());
const canManage = p => ["host","cohost"].includes(roleOf(p));
const canSpeak = p => roleOf(p) !== "listener";
const hostHere = () => everyone().some(p => roleOf(p) === "host");
const roomTitle = () => { try{ return String(JSON.parse(room?.metadata || "{}").title || ""); }catch{ return ""; } };
const byId = id => everyone().find(p => p.identity === id);

async function joinSpace(name, password){
  sp.joining = true; sp.error = ""; renderSpace();
  try{
    const pass = await api("join", {name, password: password || undefined});
    LK = await loadLiveKit();
    room = new LK.Room({audioCaptureDefaults:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
    const E = LK.RoomEvent;
    room.on(E.TrackSubscribed, (track) => { if (track.kind === "audio"){ const el = track.attach(); el.hidden = true; document.body.appendChild(el); } });
    room.on(E.TrackUnsubscribed, (track) => { track.detach().forEach(el => el.remove()); });
    [E.ParticipantConnected, E.TrackMuted, E.TrackUnmuted, E.LocalTrackPublished, E.LocalTrackUnpublished, E.TrackPublished, E.TrackUnpublished, E.ActiveSpeakersChanged, E.RoomMetadataChanged, E.AudioPlaybackStatusChanged]
      .forEach(ev => room.on(ev, renderSpace));
    room.on(E.ParticipantDisconnected, p => { delete sp.hands[p.identity]; renderSpace(); });
    room.on(E.ParticipantMetadataChanged, (_m, p) => {
      if (canSpeak(p)) delete sp.hands[p.identity];
      if (p === me()){
        if (canSpeak(p)) note(`You're now ${ROLE_LABEL[roleOf(p)].toLowerCase()}. Press Unmute to talk.`);
        else note("You're back with the listeners.");
      }
      renderSpace();
    });
    room.on(E.DataReceived, (payload, p) => {
      if (!p) return;
      let d; try{ d = JSON.parse(new TextDecoder().decode(payload)); }catch{ return; }
      if (d.type === "hand"){ if (d.up && !canSpeak(p)) sp.hands[p.identity] = Date.now(); else delete sp.hands[p.identity]; renderSpace(); }
      else if (d.type === "decline" && canManage(p)){
        delete sp.hands[d.id];
        if (d.id === me().identity) note("Your request to speak was declined this time.");
        renderSpace();
      }
      else if (d.type === "hello" && canManage(me())) send({type:"hands", hands: sp.hands}, [p.identity]);
      else if (d.type === "hands" && canManage(p)){
        for (const [k, v] of Object.entries(d.hands || {})) if (typeof v === "number" && byId(k) && !canSpeak(byId(k))) sp.hands[k] = v;
        renderSpace();
      }
    });
    room.on(E.Disconnected, reason => {
      const removed = reason === LK.DisconnectReason?.PARTICIPANT_REMOVED;
      cleanupSpace(removed ? "The host removed you from the Space." : "");
    });
    await room.connect(pass.url, pass.token);
    sp.token = pass.token; sp.joined = true;
    send({type:"hello"});
  }catch(e){
    sp.error = e?.message || "Couldn't join the Space.";
    try{ await room?.disconnect(); }catch{} room = null;
  }
  sp.joining = false; renderSpace();
}

function send(obj, to){
  try{ me()?.publishData(new TextEncoder().encode(JSON.stringify(obj)), to ? {reliable:true, destinationIdentities: to} : {reliable:true}); }catch{}
}
function cleanupSpace(msg = ""){
  document.querySelectorAll("body > audio").forEach(el => { if (el.srcObject) el.remove(); });
  room = null; Object.assign(sp, {joined:false, joining:false, token:"", hands:{}, editing:false, busy:false, error: msg});
  renderSpace();
}
async function leaveSpace(){ try{ await room?.disconnect(); }catch{} cleanupSpace(); }

async function setMic(on){
  if (!room || !canSpeak(me())) return;
  try{ await me().setMicrophoneEnabled(on); }
  catch{ note("Your microphone is blocked. Allow microphone access from the icon in your browser's address bar, then try again."); }
  renderSpace();
}
async function act(action, extra, done){
  if (sp.busy) return; sp.busy = true; renderSpace();
  try{ await api(action, extra); if (done) note(done); }
  catch(e){ note(e.message); }
  sp.busy = false; renderSpace();
}
function raiseHand(up){
  const id = me().identity;
  if (up) sp.hands[id] = Date.now(); else delete sp.hands[id];
  send({type:"hand", up}); renderSpace();
}
function note(msg){ sp.note = msg; renderSpace(); setTimeout(() => { if (sp.note === msg){ sp.note = ""; renderSpace(); } }, 7000); }
const inviteLink = () => location.href.split("#")[0] + "#space";

function actionsFor(p){
  if (p === me()) return [];
  const mine = myRole(), them = roleOf(p), id = p.identity;
  const A = (a, label) => `<button class="mini" data-act="${a}" data-id="${esc(id)}">${label}</button>`;
  const talking = p.isMicrophoneEnabled;
  if (mine === "host" && them !== "host"){
    if (them === "cohost") return [A("role:host","Make host"), A("role:speaker","Remove co-host"), talking && A("mute","Mute"), A("role:listener","Move to listeners"), A("remove","Remove")].filter(Boolean);
    if (them === "speaker") return [A("role:cohost","Make co-host"), talking && A("mute","Mute"), A("role:listener","Move to listeners"), A("remove","Remove")].filter(Boolean);
    return [A("role:speaker","Invite to speak"), A("role:cohost","Make co-host"), A("remove","Remove")];
  }
  if (mine === "cohost"){
    if (them === "speaker") return [talking && A("mute","Mute"), A("role:listener","Move to listeners")].filter(Boolean);
    if (them === "listener") return [A("role:speaker","Invite to speak")];
  }
  return [];
}

function avatar(name, big){ return `<span class="av ${big ? "big" : ""}">${esc((name || "?").charAt(0).toUpperCase())}</span>`; }
const manageMenu = (p, acts) => acts.length ? `<details class="manage" data-for="${esc(p.identity)}"><summary>Manage</summary><div class="acts">${acts.join("")}</div></details>` : "";

function renderSpace(){
  $("#partyBtn").classList.toggle("on", !!(room && sp.joined));
  const box = $("#partyBox");
  if (!room || !sp.joined){
    const saved = store.get("fx.name", "");
    box.innerHTML = `
      <h2>Puppet Space</h2>
      <p>A live audio room for the community. Anyone can join and listen. The host and co-hosts bring people up on stage to speak, and listeners can request to speak.</p>
      <form class="party-row" id="joinForm">
        <input id="partyName" maxlength="40" placeholder="Your name" value="${esc(saved)}" required>
        <button class="btn primary" type="submit" ${sp.joining ? "disabled" : ""}>${sp.joining ? "Joining…" : "Join the Space"}</button>
        <button class="btn" type="button" id="hidePartyBtn">Close</button>
      </form>
      <details class="host-login"><summary>I'm a host</summary>
        <div class="party-row"><input id="hostPass" type="password" placeholder="Host password" autocomplete="current-password"></div>
      </details>
      ${sp.error ? `<p class="party-err">${esc(sp.error)}</p>` : ""}`;
    $("#joinForm").onsubmit = e => { e.preventDefault(); const n = $("#partyName").value.trim(); if (!n) return; store.set("fx.name", n); joinSpace(n, $("#hostPass").value); };
    $("#hidePartyBtn").onclick = () => { $("#party").hidden = true; };
    return;
  }
  const draft = sp.editing ? ($("#titleInput")?.value ?? roomTitle()) : null;
  const openMenus = [...box.querySelectorAll("details.manage[open]")].map(d => d.dataset.for);

  const all = everyone();
  const order = {host:0, cohost:1, speaker:2};
  const nm = p => p.name || "Guest";
  const stage = all.filter(canSpeak).sort((a,b) => order[roleOf(a)] - order[roleOf(b)] || nm(a).localeCompare(nm(b)));
  const listeners = all.filter(p => !canSpeak(p)).sort((a,b) => (!!sp.hands[b.identity]) - (!!sp.hands[a.identity]) || nm(a).localeCompare(nm(b)));
  const requests = listeners.filter(p => sp.hands[p.identity]).sort((a,b) => sp.hands[a.identity] - sp.hands[b.identity]);
  const manager = canManage(me());
  const mineRole = myRole();

  const stageHTML = stage.map(p => {
    const on = p.isMicrophoneEnabled;
    return `<div class="speaker ${p.isSpeaking && on ? "speaking" : ""}">
      ${avatar(nm(p), true)}
      <b>${esc(nm(p))}${p === me() ? " (you)" : ""}</b>
      <span class="tag ${roleOf(p) !== "speaker" ? "v" : ""}">${ROLE_LABEL[roleOf(p)]}</span>
      <small class="${on ? "" : "mic-off"}">${on ? "mic on" : "muted"}</small>
      ${manageMenu(p, actionsFor(p))}
    </div>`; }).join("") || `<p class="empty">Nobody on stage yet.</p>`;

  const reqHTML = manager && requests.length ? `
    <h3 class="section-h">Requests to speak (${requests.length})</h3>
    <div class="people">${requests.map(p => `<div class="person hand">${avatar(nm(p))}<span>${esc(nm(p))}</span>
      <button class="mini go" data-act="role:speaker" data-id="${esc(p.identity)}">Let speak</button>
      <button class="mini" data-act="decline" data-id="${esc(p.identity)}">Decline</button></div>`).join("")}</div>` : "";

  const listenHTML = listeners.map(p => `<div class="person ${sp.hands[p.identity] ? "hand" : ""}">${avatar(nm(p))}
      <span>${esc(nm(p))}${p === me() ? " (you)" : ""}</span>
      ${sp.hands[p.identity] ? `<small>hand raised</small>` : ""}
      ${manageMenu(p, actionsFor(p))}</div>`).join("") || `<p class="empty">No listeners yet.</p>`;

  let mine = "";
  if (canSpeak(me())){
    const on = me().isMicrophoneEnabled;
    mine = `<button class="btn ${on ? "on" : ""}" id="micBtn">${on ? "Mute" : "Unmute"}</button>
      <button class="btn" id="downBtn">${mineRole === "host" ? "Step down to co-host" : "Leave the stage"}</button>`;
  } else {
    mine = `<button class="btn ${sp.hands[me().identity] ? "on" : "primary"}" id="handBtn">${sp.hands[me().identity] ? "Lower hand" : "Request to speak"}</button>`;
  }

  const title = roomTitle();
  const titleHTML = sp.editing
    ? `<form class="party-row" id="titleForm"><input id="titleInput" maxlength="80" placeholder="What's this Space about?"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" id="cancelTitle">Cancel</button></form>`
    : `<h2>${esc(title || (hostHere() ? "Puppet Space" : "Waiting for the host"))}</h2>${manager ? `<button class="mini" id="editTitle">Edit title</button>` : ""}`;

  box.innerHTML = `
    <div class="party-top">
      <div class="sp-title">
        <span class="live"><span class="live-dot"></span>${hostHere() ? "Live" : "Open"}</span>
        <div class="party-row">${titleHTML}</div>
        <small class="count">${all.length} in the Space · ${stage.length} on stage · ${listeners.length} listening</small>
      </div>
      <div class="party-row">${mine}
        <button class="btn" id="inviteBtn">Copy invite link</button>
        <button class="btn danger" id="leaveBtn">Leave</button>
      </div>
    </div>
    ${room.canPlaybackAudio === false ? `<div class="sync">Your browser paused the sound. <button class="btn primary" id="audioBtn">Turn on sound</button></div>` : ""}
    ${hostHere() ? "" : `<div class="sync">The host hasn't arrived yet. Hosts join using the host password.</div>`}
    <h3 class="section-h">On stage</h3>
    <div class="stage">${stageHTML}</div>
    ${reqHTML}
    <h3 class="section-h">Listening (${listeners.length})</h3>
    <div class="people">${listenHTML}</div>
    ${sp.note ? `<p class="party-err">${esc(sp.note)}</p>` : ""}`;

  box.querySelectorAll("details.manage").forEach(d => { if (openMenus.includes(d.dataset.for)) d.open = true; });
  if (sp.busy) box.querySelectorAll("[data-act]").forEach(b => b.disabled = true);
  if (sp.editing){ const i = $("#titleInput"); i.value = draft; i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  $("#titleForm")?.addEventListener("submit", e => { e.preventDefault(); const t = $("#titleInput").value; sp.editing = false; act("setTitle", {title: t}); });
  $("#cancelTitle")?.addEventListener("click", () => { sp.editing = false; renderSpace(); });
  $("#editTitle")?.addEventListener("click", () => { sp.editing = true; renderSpace(); $("#titleInput").value = roomTitle(); });
  $("#micBtn")?.addEventListener("click", () => setMic(!me().isMicrophoneEnabled));
  $("#downBtn")?.addEventListener("click", async () => {
    await me().setMicrophoneEnabled(false).catch(() => {});
    act("setRole", {target: me().identity, role: mineRole === "host" ? "cohost" : "listener"});
  });
  $("#handBtn")?.addEventListener("click", () => raiseHand(!sp.hands[me().identity]));
  $("#audioBtn")?.addEventListener("click", () => room.startAudio().then(renderSpace).catch(() => {}));
  $("#leaveBtn").onclick = leaveSpace;
  $("#inviteBtn").onclick = async e => {
    try{ await navigator.clipboard.writeText(inviteLink()); e.target.textContent = "Copied"; }catch{ note(inviteLink()); }
  };
}

$("#partyBox").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  b.closest("details")?.removeAttribute("open");
  const id = b.dataset.id, a = b.dataset.act, who = byId(id)?.name || "them";
  if (a.startsWith("role:")){
    const r = a.slice(5);
    delete sp.hands[id];
    act("setRole", {target:id, role:r}, r === "listener" ? `Moved ${who} to the listeners.` : `${who} is now ${ROLE_LABEL[r].toLowerCase()}.`);
  }
  else if (a === "mute") act("mute", {target:id}, `Muted ${who}.`);
  else if (a === "remove") act("remove", {target:id}, `Removed ${who}.`);
  else if (a === "decline"){ delete sp.hands[id]; send({type:"decline", id}); renderSpace(); }
});
$("#partyBtn").onclick = () => { const p = $("#party"); p.hidden = !p.hidden; if (!p.hidden){ renderSpace(); p.scrollIntoView({behavior:"smooth", block:"nearest"}); } };
window.addEventListener("beforeunload", () => { try{ room?.disconnect(); }catch{} });
if (location.hash === "#space" || location.hash === "#party"){ $("#party").hidden = false; renderSpace(); }
/* ---------- Start ---------- */
renderSpace();
</script>
</body>
</html>
